name: Wydanie (wersje pluginów + changelog)

# Po wejściu PR-a do pnia: podbicie `version` w manifeście każdego pluginu, którego
# dotknęła zmiana, plus wpisy w CHANGELOG.md. Zasady organizacji: `versioning`
# i `ci-pipeline` (sekcja „Wydanie po merge'u"). Cała logika siedzi
# w scripts/release.sh, żeby dała się uruchomić z ręki, gdy bieg padnie.
#
# DLACZEGO WERSJA PER PLUGIN: `version` w manifeście jest polem, po którym klient
# rozpoznaje dostępność aktualizacji. Jeden numer na repo znaczyłby, że zmiana
# w jednym pluginie zapowiada aktualizację pozostałych.
#
# UWAGA NA PĘTLĘ: ten workflow sam pushuje na tę samą gałąź. Chronią przed
# odpaleniem się w kółko dwie rzeczy naraz, bo każda z osobna zawodzi:
# `paths-ignore` na plikach, które krok zmienia, i warunek na markerze w treści
# commita.
on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "README.md"
      - "plugins/*/.claude-plugin/plugin.json"
  workflow_dispatch:

# Push commita wydania idzie tokenem instalacji GitHub Appa (Xvo Bot App), nie
# GITHUB_TOKEN-em. Dwa powody, oba twarde: zdarzenia wywołane GITHUB_TOKEN-em nie
# startują kolejnych workflowów, a push na chroniony pień wymaga bypassu, który
# nadaje się aktorowi - Appowi w regule organizacji, nie każdemu repo z osobna.
#
# Poświadczenia Appa (App ID i klucz prywatny) stoją jako sekrety ORGANIZACJI,
# więc nowe repo nie wymaga własnej konfiguracji. Token jest mintowany na bieżąco,
# żyje godzinę i jest zawężony do tego repo oraz dwóch uprawnień - szczegóły
# i uzasadnienie w scripts/github-app-token.sh.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[wydanie]') }}
    runs-on: ubuntu-latest
    steps:
      # Sprawdzenie idzie przed checkoutem, żeby brak konfiguracji kończył bieg
      # od razu i z nazwą brakującego sekretu, a nie dziesięć kroków później.
      - name: Sprawdź komplet konfiguracji
        env:
          APP_ID: ${{ secrets.XVO_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.XVO_BOT_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "${APP_ID}" ] || missing="${missing} XVO_BOT_APP_ID"
          [ -n "${APP_PRIVATE_KEY}" ] || missing="${missing} XVO_BOT_PRIVATE_KEY"
          if [ -n "${missing}" ]; then
            echo "::error::Brak sekretów:${missing}. To sekrety ORGANIZACJI (Organization settings > Secrets and variables > Actions, widoczność All repositories), nie repozytorium - stawia się je raz dla całej organizacji. Wartości: App ID oraz cała treść pliku .pem wygenerowanego dla Xvo Bot App."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Zakres liczy się od taga poprzedniego wydania pluginu, a shallow
          # checkout tagów nie widzi: krok uznałby, że wydania nigdy nie było.
          fetch-depth: 0
          # Obca akcja nie dostaje poświadczeń do ręki; push robi skrypt, podając
          # token wprost, więc nie zostaje on też w .git/config po biegu.
          persist-credentials: false

      # Checkout musi być wyżej, bo skrypt mintujący leży w repo.
      - name: Token instalacji Xvo Bot App
        env:
          APP_ID: ${{ secrets.XVO_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.XVO_BOT_PRIVATE_KEY }}
        run: |
          token="$(./scripts/github-app-token.sh)"
          echo "::add-mask::${token}"
          echo "RELEASE_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Wydanie
        run: ./scripts/release.sh
